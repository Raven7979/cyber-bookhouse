<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">一条内容怎么收进书屋</title>
<desc id="description">收到链接: 识别视频、图文、播客或文件; 取得证据: 正文、字幕、逐字稿或真实画面; 按模式处理: 同步笔记、蒸馏笔记或详细拆解; 写入笔记: 保留来源、状态、时间点和访问限制; 打开验收: 在 Obsidian 里回读文字、图片和本地资产</desc>
<defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d7d0c4" stroke-width="1" opacity=".55"/></pattern>
  <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M 0 0 L 16 8 L 0 16 z" fill="#3d3730"/></marker>
</defs>
<rect width="1600" height="900" fill="#f4f0e8"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="18" y="18" width="1564" height="864" fill="none" stroke="#bfb6a9" stroke-width="1"/>
<rect x="64" y="48" width="48" height="48" fill="#cf4b31"/><text x="88" y="81" text-anchor="middle" font-size="28" font-weight="900" fill="white">三</text>
<text x="126" y="82" font-size="22" font-weight="760" fill="#1d1913">赛博三味书屋</text>
<text x="64.0" y="137.0" text-anchor="start" font-size="50" font-weight="850" fill="#1d1913"><tspan x="64.0" dy="0">一条内容怎么收进书屋</tspan></text>
<text x="72.0" y="220.0" text-anchor="start" font-size="23" font-weight="500" fill="#746d63"><tspan x="72.0" dy="0">只有正文、逐字稿或画面证据真实存在时，才继续总结和分析</tspan></text>
<g><path d="M 342.0 465.0 C 357.3 465.0, 360.7 465.0, 376.0 465.0" fill="none" stroke="#3d3730" stroke-width="4" marker-end="url(#arrow)"/><path d="M 636.0 465.0 C 651.3 465.0, 654.7 465.0, 670.0 465.0" fill="none" stroke="#3d3730" stroke-width="4" marker-end="url(#arrow)"/><path d="M 930.0 465.0 C 945.3 465.0, 948.7 465.0, 964.0 465.0" fill="none" stroke="#3d3730" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1224.0 465.0 C 1239.3 465.0, 1242.7 465.0, 1258.0 465.0" fill="none" stroke="#3d3730" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="94.0" y="364.0" width="260.0" height="230.0" rx="20" fill="#c9c0b3" opacity=".34"/><rect x="82.0" y="350.0" width="260.0" height="230.0" rx="20" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><path d="M 102.0 350.0 H 322.0" stroke="#2f7668" stroke-width="8" stroke-linecap="round"/><circle cx="212.0" cy="388.0" r="17" fill="#2f7668" opacity=".14"/><text x="212.0" y="395.0" text-anchor="middle" font-size="18" font-weight="800" fill="#2f7668">01</text><text x="212.0" y="428.0" text-anchor="middle" font-size="26" font-weight="780" fill="#1d1913"><tspan x="212.0" dy="0">收到链接</tspan></text><text x="212.0" y="476.0" text-anchor="middle" font-size="17" font-weight="500" fill="#746d63"><tspan x="212.0" dy="0">识别视频、图文、播客</tspan><tspan x="212.0" dy="26">或文件</tspan></text><rect x="388.0" y="364.0" width="260.0" height="230.0" rx="20" fill="#c9c0b3" opacity=".34"/><rect x="376.0" y="350.0" width="260.0" height="230.0" rx="20" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><path d="M 396.0 350.0 H 616.0" stroke="#cf4b31" stroke-width="8" stroke-linecap="round"/><circle cx="506.0" cy="388.0" r="17" fill="#cf4b31" opacity=".14"/><text x="506.0" y="395.0" text-anchor="middle" font-size="18" font-weight="800" fill="#cf4b31">02</text><text x="506.0" y="428.0" text-anchor="middle" font-size="26" font-weight="780" fill="#1d1913"><tspan x="506.0" dy="0">取得证据</tspan></text><text x="506.0" y="476.0" text-anchor="middle" font-size="17" font-weight="500" fill="#746d63"><tspan x="506.0" dy="0">正文、字幕、逐字稿或</tspan><tspan x="506.0" dy="26">真实画面</tspan></text><rect x="682.0" y="364.0" width="260.0" height="230.0" rx="20" fill="#c9c0b3" opacity=".34"/><rect x="670.0" y="350.0" width="260.0" height="230.0" rx="20" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><path d="M 690.0 350.0 H 910.0" stroke="#7552d6" stroke-width="8" stroke-linecap="round"/><circle cx="800.0" cy="388.0" r="17" fill="#7552d6" opacity=".14"/><text x="800.0" y="395.0" text-anchor="middle" font-size="18" font-weight="800" fill="#7552d6">03</text><text x="800.0" y="428.0" text-anchor="middle" font-size="26" font-weight="780" fill="#1d1913"><tspan x="800.0" dy="0">按模式处理</tspan></text><text x="800.0" y="476.0" text-anchor="middle" font-size="17" font-weight="500" fill="#746d63"><tspan x="800.0" dy="0">同步笔记、蒸馏笔记或</tspan><tspan x="800.0" dy="26">详细拆解</tspan></text><rect x="976.0" y="364.0" width="260.0" height="230.0" rx="20" fill="#c9c0b3" opacity=".34"/><rect x="964.0" y="350.0" width="260.0" height="230.0" rx="20" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><path d="M 984.0 350.0 H 1204.0" stroke="#335caa" stroke-width="8" stroke-linecap="round"/><circle cx="1094.0" cy="388.0" r="17" fill="#335caa" opacity=".14"/><text x="1094.0" y="395.0" text-anchor="middle" font-size="18" font-weight="800" fill="#335caa">04</text><text x="1094.0" y="428.0" text-anchor="middle" font-size="26" font-weight="780" fill="#1d1913"><tspan x="1094.0" dy="0">写入笔记</tspan></text><text x="1094.0" y="476.0" text-anchor="middle" font-size="17" font-weight="500" fill="#746d63"><tspan x="1094.0" dy="0">保留来源、状态、时间</tspan><tspan x="1094.0" dy="26">点和访问限制</tspan></text><rect x="1270.0" y="364.0" width="260.0" height="230.0" rx="20" fill="#c9c0b3" opacity=".34"/><rect x="1258.0" y="350.0" width="260.0" height="230.0" rx="20" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><path d="M 1278.0 350.0 H 1498.0" stroke="#2f7668" stroke-width="8" stroke-linecap="round"/><circle cx="1388.0" cy="388.0" r="17" fill="#2f7668" opacity=".14"/><text x="1388.0" y="395.0" text-anchor="middle" font-size="18" font-weight="800" fill="#2f7668">05</text><text x="1388.0" y="428.0" text-anchor="middle" font-size="26" font-weight="780" fill="#1d1913"><tspan x="1388.0" dy="0">打开验收</tspan></text><text x="1388.0" y="476.0" text-anchor="middle" font-size="17" font-weight="500" fill="#746d63"><tspan x="1388.0" dy="0">在 Obsidian 里回读文</tspan><tspan x="1388.0" dy="26">字、图片和本地资产</tspan></text></g><text x="72.0" y="852.0" text-anchor="start" font-size="18" font-weight="500" fill="#746d63"><tspan x="72.0" dy="0">拿不到的内容明确标记，不用标题和简介补写。</tspan></text>
</svg>
