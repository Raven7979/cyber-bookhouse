name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build portable skill archive
        run: python scripts/build_release.py
      - name: Inspect archive
        run: unzip -l dist/cyber-bookhouse.zip
